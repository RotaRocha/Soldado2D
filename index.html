<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Soldado 2D">
    <title>Soldado 2D HD: Apocalipse Sombrio</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0;
            background: #010103;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            width: 100%; height: 100%;
            overflow: hidden;
            position: fixed;
        }
        #game-wrapper {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #010103;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #050208, #0e0412);
            box-shadow: 0 0 40px rgba(150, 0, 40, 0.35);
            max-width: 100%;
            max-height: 72vh;
        }
        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 520px;
            padding: 8px 12px 12px;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }
        @media (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
        .dpad {
            display: grid;
            grid-template-columns: 52px 52px 52px;
            grid-template-rows: 48px 48px 48px;
            gap: 4px;
        }
        .dpad .btn {
            width: 52px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold;
            background: rgba(180, 20, 50, 0.25);
            border: 2px solid #991f3d;
            border-radius: 10px;
            color: #fff;
            user-select: none;
        }
        .dpad .btn:active, .dpad .btn.active {
            background: rgba(180, 20, 50, 0.7);
        }
        .dpad .empty { visibility: hidden; }
        .center-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        #btn-summon {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: rgba(0, 180, 140, 0.3);
            border: 3px solid #00c9a0;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            line-height: 1.15;
            user-select: none;
        }
        #btn-summon:active, #btn-summon.active {
            background: rgba(0, 180, 140, 0.7);
        }
        #btn-summon.disabled {
            opacity: 0.35;
            border-color: #555;
            background: rgba(80,80,80,0.3);
        }
        #btn-fire {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.3);
            border: 3px solid #ff3333;
            color: #fff;
            font-size: 26px;
            display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        #btn-fire:active, #btn-fire.active {
            background: rgba(255, 50, 50, 0.75);
        }
        .speech {
            position: absolute;
            background: rgba(0,0,0,0.85);
            color: #00ffcc;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
            border: 1px solid #00c9a0;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="960" height="480"></canvas>
        <div id="mobile-controls">
            <div class="dpad">
                <div class="empty"></div>
                <div class="btn" id="btn-up">▲</div>
                <div class="empty"></div>
                <div class="btn" id="btn-left">◀</div>
                <div class="empty"></div>
                <div class="btn" id="btn-right">▶</div>
                <div class="empty"></div>
                <div class="btn" id="btn-down">▼</div>
                <div class="empty"></div>
            </div>
            <div class="center-btns">
                <div id="btn-summon">ALIADO<br>−1♥</div>
                <div id="btn-fire">🔫</div>
            </div>
        </div>
    </div>

    <script>
        // ========== ÁUDIO ==========
        let audioCtx = null, musicInterval = null, isMusicPlaying = false, isBossMusic = false;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playRealisticGunshot(type = 'pistol') {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let bufferSize = audioCtx.sampleRate * (type === 'rifle' ? 0.18 : 0.1);
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(type === 'rifle' ? 700 : 1100, now);
                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(type === 'rifle' ? 0.35 : 0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (type === 'rifle' ? 0.18 : 0.1));
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now);
                let osc = audioCtx.createOscillator(), oscGain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(type === 'rifle' ? 130 : 200, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                oscGain.gain.setValueAtTime(0.25, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(oscGain); oscGain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.12);
            } catch(e) {}
        }
        function playPunchSound() {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(25, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.12);
            } catch(e) {}
        }
        function playVoiceSound() {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180 + Math.random() * 80, now);
                osc.frequency.linearRampToValueAtTime(120, now + 0.08);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.1);
            } catch(e) {}
        }
        function playExplosionSound(heavy = false) {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let duration = heavy ? 0.55 : 0.32;
                let bufferSize = audioCtx.sampleRate * duration;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(heavy ? 220 : 380, now);
                filter.frequency.linearRampToValueAtTime(30, now + duration);
                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(heavy ? 0.5 : 0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now);
            } catch(e) {}
        }
        function playHitSound() {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.15);
            } catch(e) {}
        }
        function playLifeUpSound() {
            if (!audioCtx) return;
            try {
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
                    gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.07 + 0.12);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.07);
                    osc.stop(audioCtx.currentTime + idx * 0.07 + 0.12);
                });
            } catch(e) {}
        }
        function playBossSpawnSound() {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(70, now);
                osc.frequency.linearRampToValueAtTime(260, now + 0.8);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.8);
            } catch(e) {}
        }
        let musicMode = 'menu'; // menu | normal | boss | phase2 | cutscene
        function setMusicMode(mode) { musicMode = mode; }
        function setBossMusicMode(active) { musicMode = active ? 'boss' : 'normal'; }

        function startBGM() {
            stopBGM();
            isMusicPlaying = true;
            let step = 0;
            const getTempo = () => {
                if (musicMode === 'cutscene') return 380;
                if (musicMode === 'phase2') return 320;
                if (musicMode === 'boss') return 130;
                if (musicMode === 'menu') return 220;
                return 190;
            };
            function tick() {
                if (!isMusicPlaying || !audioCtx) return;
                if (gameState === 'gameOver' || gameState === 'victory') {
                    musicInterval = setTimeout(tick, getTempo());
                    return;
                }
                try {
                    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    let notes, wave, vol, dur;
                    if (musicMode === 'menu') {
                        notes = [110, 130.81, 146.83, 164.81, 146.83, 130.81];
                        wave = 'sawtooth'; vol = 0.035; dur = 0.28;
                    } else if (musicMode === 'boss') {
                        notes = [82.41, 82.41, 110, 123.47, 82.41, 98, 110, 73.42];
                        wave = 'sawtooth'; vol = 0.06; dur = 0.18;
                    } else if (musicMode === 'phase2') {
                        notes = [65.41, 73.42, 82.41, 98.00, 87.31, 73.42];
                        wave = 'triangle'; vol = 0.04; dur = 0.45;
                    } else if (musicMode === 'cutscene') {
                        // Épica + melancólica (notas graves e longas)
                        notes = [55, 65.41, 73.42, 82.41, 98, 87.31, 73.42, 65.41];
                        wave = 'triangle'; vol = 0.05; dur = 0.55;
                    } else {
                        notes = [146.83, 174.61, 196, 174.61];
                        wave = 'triangle'; vol = 0.028; dur = 0.22;
                    }
                    osc.type = wave;
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + dur);
                    // Harmônico suave na cutscene (mais épico)
                    if (musicMode === 'cutscene' && step % 2 === 0) {
                        let osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain();
                        osc2.type = 'sine';
                        osc2.frequency.setValueAtTime(notes[step % notes.length] * 2, audioCtx.currentTime);
                        gain2.gain.setValueAtTime(0.02, audioCtx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                        osc2.connect(gain2); gain2.connect(audioCtx.destination);
                        osc2.start(); osc2.stop(audioCtx.currentTime + 0.4);
                    }
                    step++;
                } catch(e) {}
                musicInterval = setTimeout(tick, getTempo());
            }
            tick();
        }
        function stopBGM() {
            isMusicPlaying = false;
            if (musicInterval) { clearTimeout(musicInterval); musicInterval = null; }
        }

        // ========== CANVAS RESPONSIVO ==========
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const BASE_W = 960, BASE_H = 480;

        function resizeCanvas() {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight * 0.72;
            let scale = Math.min(maxW / BASE_W, maxH / BASE_H);
            canvas.style.width = (BASE_W * scale) + "px";
            canvas.style.height = (BASE_H * scale) + "px";
        }
        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150));
        resizeCanvas();

        // ========== ESTADO ==========
        // gameState: 'menu' | 'playing' | 'phase2' | 'victory' | 'gameOver'
        let gameState = 'menu';
        let score = 0, highscore = localStorage.getItem("soldier_hd_highscore") || 0;
        let lives = 5, killsCount = 0;
        let baseFireRate = 280, lastShotTime = 0;
        let playerWeaponLevel = 0;
        const weaponNames = ["PISTOLA", "FUZIL", "ESPINGARDA", "LANÇA-FOGUETES", "LASER", "CALIBRE 12"];
        const weaponDamage = [1, 2, 3, 5, 8, 12];
        const weaponRate = [280, 220, 350, 500, 180, 420];

        let bossActive = false;
        let miniBossesSpawned = [false, false, false, false, false];
        let phase2Boss = null;
        let bossProjectiles = [];
        let bossShootTimer = 0;
        let screenFlash = 0;
        let redFlash = 0;
        let transitioning = false;
        let transitionTimer = 0;
        let minigunPickup = null;
        let hasMinigun = false;
        let minigunGlow = 0;
        // Cutscene final
        let cutsceneTimer = 0;
        let cutsceneBoss = null; // boss morto no chão
        let cutsceneShot = false;
        let cutsceneExploded = false;
        let bloodParticles = [];

        const keys = {};
        let touchLeft = false, touchRight = false, touchUp = false, touchDown = false, touchFire = false, touchSummon = false;

        // Botões virtuais do menu (coordenadas no canvas)
        const startBtn = { x: 380, y: 320, w: 200, h: 55 };
        const menuBtn = { x: 380, y: 340, w: 200, h: 50 };

        // ========== INPUT ==========
        window.addEventListener("keydown", (e) => {
            initAudio();
            keys[e.code] = true;
            if (gameState === 'gameOver' && e.code === "KeyR") startGame();
            if (gameState === 'playing' || gameState === 'phase2') {
                if (e.code === "KeyE" || e.code === "KeyQ") trySummonAlly();
            }
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function setupTouchButton(id, setTrue, setFalse) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = (e) => {
                e.preventDefault();
                initAudio();
                if (gameState !== 'playing' && gameState !== 'phase2') return;
                setTrue();
            };
            const end = (e) => { e.preventDefault(); setFalse(); };
            el.addEventListener("touchstart", start, {passive: false});
            el.addEventListener("touchend", end, {passive: false});
            el.addEventListener("touchcancel", end, {passive: false});
            el.addEventListener("mousedown", start);
            el.addEventListener("mouseup", end);
            el.addEventListener("mouseleave", end);
        }
        setupTouchButton("btn-left", () => touchLeft = true, () => touchLeft = false);
        setupTouchButton("btn-right", () => touchRight = true, () => touchRight = false);
        setupTouchButton("btn-up", () => touchUp = true, () => touchUp = false);
        setupTouchButton("btn-down", () => touchDown = true, () => touchDown = false);
        setupTouchButton("btn-fire", () => touchFire = true, () => touchFire = false);
        setupTouchButton("btn-summon", () => { touchSummon = true; trySummonAlly(); }, () => touchSummon = false);

        let mouseX = 480, mouseY = 240, isMouseDown = false;
        function canvasToGame(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (BASE_W / rect.width),
                y: (e.clientY - rect.top) * (BASE_H / rect.height)
            };
        }
        canvas.addEventListener("mousemove", (e) => {
            const p = canvasToGame(e);
            mouseX = p.x; mouseY = p.y;
        });
        canvas.addEventListener("mousedown", (e) => {
            initAudio();
            isMouseDown = true;
            const p = canvasToGame(e);
            handleCanvasClick(p.x, p.y);
        });
        canvas.addEventListener("mouseup", () => { isMouseDown = false; });
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            initAudio();
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const p = {
                x: (t.clientX - rect.left) * (BASE_W / rect.width),
                y: (t.clientY - rect.top) * (BASE_H / rect.height)
            };
            handleCanvasClick(p.x, p.y);
        }, {passive: false});

        function handleCanvasClick(x, y) {
            if (gameState === 'menu') {
                if (x >= startBtn.x && x <= startBtn.x + startBtn.w && y >= startBtn.y && y <= startBtn.y + startBtn.h) {
                    startGame();
                }
            } else if (gameState === 'victory' || gameState === 'gameOver') {
                if (x >= menuBtn.x && x <= menuBtn.x + menuBtn.w && y >= menuBtn.y && y <= menuBtn.y + menuBtn.h) {
                    goToMenu();
                }
            }
        }

        function startGame() {
            score = 0; lives = 5; killsCount = 0;
            playerWeaponLevel = 0;
            baseFireRate = weaponRate[0];
            bossActive = false;
            miniBossesSpawned = [false, false, false, false, false];
            phase2Boss = null;
            bossProjectiles = [];
            bossShootTimer = 0;
            screenFlash = 0; redFlash = 0;
            transitioning = false; transitionTimer = 0;
            minigunPickup = null; hasMinigun = false; minigunGlow = 0;
            cutsceneTimer = 0; cutsceneBoss = null; cutsceneShot = false; cutsceneExploded = false; bloodParticles = [];
            setBossMusicMode(false);
            setMusicMode('normal');
            bullets = []; monsters = []; particles = []; floatingTexts = []; allies = []; bosses = []; speeches = [];
            player.x = 80; player.y = 370; player.vx = 0; player.vy = 0;
            gameState = 'playing';
            startBGM();
            updateSummonButton();
        }

        function goToMenu() {
            stopBGM();
            gameState = 'menu';
            setMusicMode('menu');
            startBGM();
            phase2Boss = null;
            bossProjectiles = [];
            bosses = []; monsters = []; bullets = []; allies = [];
        }

        // ========== MUNDO MAIOR ==========
        const platforms = [
            { x: 0, y: 430, w: 960, h: 50 },
            { x: 60, y: 320, w: 220, h: 18 },
            { x: 340, y: 250, w: 200, h: 18 },
            { x: 620, y: 320, w: 220, h: 18 },
            { x: 180, y: 160, w: 180, h: 18 },
            { x: 520, y: 140, w: 200, h: 18 },
            { x: 780, y: 200, w: 140, h: 18 }
        ];

        const player = {
            x: 80, y: 370, w: 34, h: 44,
            vx: 0, vy: 0, speed: 5.2, jumpForce: -14.5,
            gravity: 0.55, isGrounded: false, facingRight: true
        };

        let bullets = [], monsters = [], particles = [], floatingTexts = [], allies = [], bosses = [], speeches = [];
        let monsterSpawnTimer = 0;

        function createParticles(x, y, color, count = 12) {
            // Limite de partículas para não travar o jogo
            if (particles.length > 120) return;
            count = Math.min(count, 20);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 3.5 + 1.5,
                    color, life: 28
                });
            }
        }
        function addSpeech(text, x, y) {
            if (speeches.length > 6) speeches.shift();
            speeches.push({ text, x, y, life: 70 });
        }
        function addFloatingText(text, x, y, color) {
            if (floatingTexts.length > 12) floatingTexts.shift();
            floatingTexts.push({ text, x, y, color, life: 45 });
        }

        function updateSummonButton() {
            const btn = document.getElementById("btn-summon");
            if (!btn) return;
            // Desativa na fase 2, durante bosses finais, ou sem vida
            if (gameState === 'phase2' || bossActive || lives <= 1 || allies.length >= 10) {
                btn.classList.add("disabled");
            } else {
                btn.classList.remove("disabled");
            }
        }

        function clampLives() {
            if (lives > 100) lives = 100;
            if (lives < 0) lives = 0;
        }

        function trySummonAlly() {
            if (gameState !== 'playing') return; // desativado na fase 2 / boss final
            if (bossActive) {
                addFloatingText("NÃO PODE CONVOCAR AGORA!", player.x - 50, player.y - 30, "#ffaa00");
                return;
            }
            if (lives <= 1) {
                addFloatingText("VIDA INSUFICIENTE!", player.x - 30, player.y - 30, "#ff5555");
                return;
            }
            if (allies.length >= 10) {
                addFloatingText("LIMITE DE 10 ALIADOS!", player.x - 50, player.y - 30, "#ffaa00");
                return;
            }

            lives--;
            playLifeUpSound();

            const allyTypes = ['pistol', 'rifle', 'rocket'];
            const chosenType = allyTypes[allies.length % allyTypes.length];
            const targetPlatform = platforms[1 + Math.floor(Math.random() * (platforms.length - 1))];

            const ally = {
                x: targetPlatform.x + 30 + (Math.random() * 40 - 20),
                y: targetPlatform.y - 38,
                w: 30, h: 38,
                weapon: chosenType,
                shootTimer: 0,
                vx: (Math.random() < 0.5 ? 1 : -1) * 1.8,
                vy: 0,
                isGrounded: true,
                punchAnim: 0,
                protectMode: false
            };
            allies.push(ally);

            // Presente de arma mais forte
            if (playerWeaponLevel < weaponNames.length - 1) {
                playerWeaponLevel++;
                baseFireRate = weaponRate[playerWeaponLevel];
                addFloatingText(`ARMA: ${weaponNames[playerWeaponLevel]}!`, player.x - 20, player.y - 45, "#00ffcc");
                addSpeech("pega aí!", ally.x, ally.y - 25);
            } else {
                addSpeech("pega aí!", ally.x, ally.y - 25);
                addFloatingText("+1 ALIADO!", player.x, player.y - 30, "#00ffaa");
            }

            updateSummonButton();
        }

        function startBossDeathCutscene() {

            cutsceneBoss = {
                x: phase2Boss.x,
                y: platforms[0].y - 50, // no chão
                w: phase2Boss.w,
                h: 50,

            };
            phase2Boss = null;

            bossProjectiles = [];
            bloodParticles = [];

        function updateCutscene() {
            cutsceneTimer++;
            // ~60fps → ~14 segundos ≈ 840 frames
            // 0-100: boss sangra, jogador anda
            // 150: tiro final
            // 170: grito
            // 210: explode
            // 280-420: diálogo aliado / jogador
            // 450-700: texto final + música
            // 840: vitória

            if (cutsceneBoss && !cutsceneExploded && cutsceneTimer % 4 === 0) {
                bloodParticles.push({
                    x: cutsceneBoss.x + Math.random() * cutsceneBoss.w,
                    y: cutsceneBoss.y + 10,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: Math.random() * 1.5 + 0.5,
                    life: 40 + Math.random() * 20,
                    size: 2 + Math.random() * 3
                });
            }
            for (let i = bloodParticles.length - 1; i >= 0; i--) {
                let bp = bloodParticles[i];
                bp.x += bp.vx; bp.y += bp.vy; bp.life--;
                if (bp.y > platforms[0].y - 2) { bp.y = platforms[0].y - 2; bp.vx *= 0.5; }
                if (bp.life <= 0) bloodParticles.splice(i, 1);
            }

            if (cutsceneTimer < 100 && cutsceneBoss) {
                let targetX = cutsceneBoss.x - 50;
                if (Math.abs(player.x - targetX) > 4) {
                    player.x += player.x < targetX ? 3.2 : -3.2;
                    player.facingRight = player.x < targetX;
                }
                player.y = platforms[0].y - player.h;
            }

            if (cutsceneTimer === 150 && !cutsceneShot && cutsceneBoss) {
                cutsceneShot = true;
                playRealisticGunshot('rifle');
                playRealisticGunshot('rifle');
                bullets.push({
                    x: player.x + player.w / 2,
                    y: player.y + player.h / 2,
                    vx: (cutsceneBoss.x - player.x) * 0.15,
                    vy: 0,
                    damage: 0, isAlly: false, type: 'minigun', life: 20
                });
                cutsceneBoss.shake = 20;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (!b) { bullets.splice(i, 1); continue; }
                b.x += b.vx; b.y += b.vy;
                if (b.life !== undefined) { b.life--; if (b.life <= 0) bullets.splice(i, 1); }
            }

            if (cutsceneBoss && cutsceneBoss.shake > 0) cutsceneBoss.shake--;

            if (cutsceneTimer === 170) {
                addFloatingText("AAAAARGH!", cutsceneBoss ? cutsceneBoss.x : 400, 200, "#ff0000");
                playBossSpawnSound();
            }

            if (cutsceneTimer === 210 && !cutsceneExploded) {
                cutsceneExploded = true;
                playExplosionSound(true);
                playExplosionSound(true);
                if (cutsceneBoss) {
                    createParticles(cutsceneBoss.x + cutsceneBoss.w / 2, cutsceneBoss.y, "#ff0000", 20);
                    createParticles(cutsceneBoss.x + cutsceneBoss.w / 2, cutsceneBoss.y, "#ff6600", 15);
                    createParticles(cutsceneBoss.x + cutsceneBoss.w / 2, cutsceneBoss.y, "#ffffff", 12);
                }
                screenFlash = 50;
                cutsceneBoss = null;
            }

            // Diálogo (maior e mais longo)
            if (cutsceneTimer === 300 && allies.length > 0) {
                let a = allies[0];
                speeches.push({ text: "conseguimos então?", x: a.x - 30, y: a.y - 40, life: 150, big: true });
                playVoiceSound();
            }
            if (cutsceneTimer === 420) {
                speeches.push({ text: "Sim, mas nunca é o fim", x: player.x - 40, y: player.y - 45, life: 160, big: true });
                playVoiceSound();
            }

            for (let i = speeches.length - 1; i >= 0; i--) {
                speeches[i].life--;
                if (speeches[i].life <= 0) speeches.splice(i, 1);
            }

            if (screenFlash > 0) screenFlash--;

            // ~14 segundos
            if (cutsceneTimer >= 840) {
                gameState = 'victory';
                stopBGM();
                bloodParticles = [];
                bullets = [];
                speeches = [];
            }
        }

        function startPhase2() {

            monsters = [];
            bosses = [];
            bullets = [];
            bossProjectiles = [];
            particles = [];
            floatingTexts = [];
            hasMinigun = false;
            minigunGlow = 0;
            // Minigun branca em uma plataforma do meio

            };
            phase2Boss = {

                w: 120, h: 130,
                hp: 60000, maxHp: 60000,

                floatAngle: 0
            };

            transitionTimer = 0;
            screenFlash = 0;
